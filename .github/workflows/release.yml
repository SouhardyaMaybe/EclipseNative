name: Native Release

on:
  push:
    tags: ["native-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing native tag to publish (for example native-v0.1.0)"
        required: true
        type: string
      dry_run:
        description: "Build and verify, but do not create a GitHub Release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: native-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Check tag and lock
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Require native-v<version> to match sources.lock.json
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          case "$TAG" in
            native-v*) ;;
            *) echo "tag must start with native-v: $TAG" >&2; exit 1 ;;
          esac
          version="${TAG#native-v}"
          locked="$(python3 -c 'import json; print(json.load(open("sources.lock.json"))["version"])')"
          if [ "$version" != "$locked" ]; then
            echo "tag version $version does not match sources.lock.json $locked" >&2
            exit 1
          fi
          python3 scripts/lock.py --check

  native:
    name: Build native artifacts
    needs: preflight
    uses: ./.github/workflows/native.yml
    with:
      ref: ${{ github.event.inputs.tag || github.ref }}

  publish:
    name: Publish GitHub Release
    needs: [preflight, native]
    if: ${{ github.event_name == 'push' || !inputs.dry_run }}
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: eclipsenatives
          path: dist

      - name: Verify the downloaded package
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c SHA256SUMS.txt
          test -f BUILD-MANIFEST.json

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(find dist -maxdepth 1 -type f \
            \( -name '*.aar' -o -name '*.zip' -o -name 'BUILD-MANIFEST.json' -o -name 'SHA256SUMS.txt' \) | sort)
          if [ "${#assets[@]}" -ne 4 ]; then
            echo "expected exactly four release assets, found ${#assets[@]}" >&2
            printf '%s\n' "${assets[@]}" >&2
            exit 1
          fi
          gh release create "$TAG" "${assets[@]}" \
            --verify-tag \
            --title "EclipseNatives $TAG" \
            --generate-notes
