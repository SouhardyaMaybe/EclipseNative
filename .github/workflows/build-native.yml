name: build-native

# DRAFT skeleton: builds the LWJGL3 Android natives and OpenAL Soft for the
# four supported ABIs, then packages them into the two aars the launcher
# consumes. Expect per-cell iteration on first runs.

on:
  workflow_dispatch:
  push:
    tags:
      - "native-*"

permissions:
  contents: write

env:
  NDK_VERSION: "25.2.9519653"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        component: [lwjgl3, openal]
        arch: [arm, arm64, x86, x86_64]
    name: "${{ matrix.component }}-${{ matrix.arch }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          df -h

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install NDK
        run: sdkmanager "ndk;${{ env.NDK_VERSION }}"

      # DRAFT: script builds libffi/freetype/shaderc inputs and drives
      # LWJGL's ant build, or OpenAL Soft's CMake build, per ABI.
      - name: Build natives (FIRST DRAFT)
        env:
          ECLIPSE_ARCH: ${{ matrix.arch }}
        run: |
          if [ "${{ matrix.component }}" = "lwjgl3" ]; then
            bash scripts/build-lwjgl3-android.sh "${{ matrix.arch }}"
          else
            bash scripts/build-openal-android.sh "${{ matrix.arch }}"
          fi

      - name: Upload per-ABI .so files
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.component }}-so-${{ matrix.arch }}
          path: out/so/
          if-no-files-found: error

  assemble:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: lwjgl3
            module: lwjgl3-android
            aar: lwjgl3-natives-release.aar
          - component: openal
            module: openal-android
            aar: openal-soft-release.aar
    name: "assemble-${{ matrix.component }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # AGP strips jniLibs at packaging time, so the NDK is needed here too.
      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install NDK and platform
        run: |
          sdkmanager "ndk;${{ env.NDK_VERSION }}" "platforms;android-34" "build-tools;34.0.0"

      - name: Download per-ABI .so files
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ matrix.component }}-so-*
          path: ${{ matrix.module }}/src/main/jniLibs
          merge-multiple: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Assemble aar (DRAFT)
        run: gradle ":${{ matrix.module }}:assembleRelease" --no-daemon --stacktrace

      - name: Upload aar artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.component }}-aar
          path: ${{ matrix.module }}/build/outputs/aar/*.aar
          if-no-files-found: error

      - name: Publish aar to tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.module }}/build/outputs/aar/*.aar
